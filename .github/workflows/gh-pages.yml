name: GitHub Pages

on:
  push:
    branches:
      - main  # Set a branch name to trigger deployment
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.90.0
  MDBOOK_VERSION: 0.5.4

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust and mdBook
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --no-self-update
          cargo +"$RUST_TOOLCHAIN" install mdbook \
            --version "$MDBOOK_VERSION" \
            --locked

      - name: Build main
        run: mdbook build -d build

      - name: Build Hexagon
        run: cd opt/hexagon && mdbook build -d build

      - name: Build TroubleShooting
        run: cd troubleshooting && mdbook build -d build

      - name: Assemble site
        run: |
          mkdir -p site/opt/hexagon site/troubleshooting
          cp -r build/. site/
          cp -r opt/hexagon/build/. site/opt/hexagon/
          cp -r troubleshooting/build/. site/troubleshooting/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
